[project]
name = "filmfoundry-skills"
version = "2.2.0"
# v1.3.3 compatibility baseline: version = "1.3.3"
description = "Production-oriented Agent Skills for model-agnostic AI filmmaking workflows"
requires-python = ">=3.11"

[project.scripts]
ff = "filmfoundry_v2.cli:main"

[tool.setuptools.packages.find]
include = ["filmfoundry_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
