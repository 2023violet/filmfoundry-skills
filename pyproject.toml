[project]
name = "filmfoundry-skills"
version = "3.0.0"
description = "Production-oriented Agent Skills for model-agnostic AI filmmaking workflows"
requires-python = ">=3.11"

[project.scripts]
ff = "filmfoundry.cli:main"

[tool.setuptools.packages.find]
include = ["filmfoundry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["historical"]
